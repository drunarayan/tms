---
layout: page
title: Home
---

<div class="posts-wrapper">
  {% for post in site.posts %}
    {% if post.featured-post == true %}
      <article class="post-preview">
        <h2><a href="{{ post.url | relative_url }}">{{ post.title }}</a></h2>
        <p>{{ post.excerpt | strip_html | truncatewords: 30 }}</p>
      </article>
    {% endif %}
  {% endfor %}
</div>
